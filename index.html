:#f1e1b2;color:#795a18}.muted{color:#708079}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search,.field input,.field select{padding:10px 12px;border:1px solid #cbdad2;border-radius:7px;background:white;min-width:190px}.paging{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:15px 0}.field label{display:block;font-size:12px;color:#52685b;margin-bottom:7px}.field input,.field select{width:100%}.pill{display:inline-block;background:#edf3f0;border-radius:20px;padding:4px 9px}.login-cover{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(125deg,#183d2d,#f2f7f3)}.login-card{width:min(410px,100%);background:white;border-radius:16px;padding:34px;box-shadow:0 20px 70px #0a261f35}.login-card h1{margin:0 0 8px}.login-card input{display:block;width:100%;padding:12px;margin:12px 0;border:1px solid #cbdad2;border-radius:8px}.login-card button{width:100%;margin-top:8px}.error{color:#b03432;margin:10px 0}.status-message{font-size:13px;line-height:1.55;overflow-wrap:anywhere}.status-message.error{color:#b03432}.status-message.success{color:#146c44}.link-button{display:block;width:100%;border:0;background:transparent;color:#156b48;padding:12px 5px;text-decoration:underline;font-size:13px}.link-button:hover{color:#0d4431}.foot{padding:12px 28px;color:#687970;font-size:11px}@media(max-width:850px){.shell{display:block}.sidebar{width:100%;padding:12px;display:flex;gap:5px;overflow:auto}.brand{font-size:15px;margin:10px}.brand small,.side-label{display:none}.nav{width:auto;white-space:nowrap}.content{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.top{padding:16px}.fields{grid-template-columns:1fr}}

<div id="login" class="login-cover">
<form id="loginForm" class="login-card"><h1>Rfriend Business OS</h1><p class="muted">OPPO Austria · ERP 员工登录</p>
<label>员工邮箱<input id="email" type="email" autocomplete="username" required></label>
<label>密码<input id="password" type="password" autocomplete="current-password" required></label>
<button id="loginBtn" type="submit" class="btn primary">登录 / Sign in</button>
<button id="forgotBtn" type="button" class="link-button">忘记密码？ / Forgot password</button>
<p id="loginError" class="error" role="alert"></p><small class="muted">仅开放给已授权的 ERP 员工账号</small></form>
<form id="forgotForm" class="login-card hidden"><h1>重置密码</h1><p class="muted">我们将发送一次性安全链接至你的工作邮箱。</p>
<label>员工邮箱<input id="recoveryEmail" type="email" autocomplete="email" required></label>
<button id="sendRecoveryBtn" type="submit" class="btn primary">发送重置邮件 / Send reset link</button>
<button id="backToLogin" type="button" class="link-button">返回登录 / Back to sign in</button>
<p id="forgotStatus" class="status-message" role="status"></p></form>
<form id="resetForm" class="login-card hidden"><h1>设置新密码</h1>
<p class="muted">通过邮件链接验证身份后，请设置新密码。</p>
<label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
<label>确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
<p class="muted">至少 12 个字符，建议混合字母、数字和符号。</p>
<button id="changePasswordBtn" type="submit" class="btn primary" disabled>保存新密码 / Save password</button>
<p id="resetStatus" class="status-message" role="status"></p>
<button id="resetBackToLogin" type="button" class="link-button">返回登录 / Back to sign in</button>
</form>
</div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">Rfriend OS<small>Austria · Operations</small></div><div class="side-label">工作台</div><button class="nav active" data-page="overview">经营总览</button><button class="nav" data-page="tasks">我的待办</button><div class="side-label">销售与履约</div><button class="nav" data-page="orders">销售订单</button><button class="nav" data-page="shipments">手工发货</button><div class="side-label">经营分析</div><button class="nav" data-page="reports">销售报告</button></aside>
<main><div class="top"><div class="page-title-group"><h1 id="heading">经营总览</h1><div id="subtitle" class="muted" style="font-size:12px">销售 · 库存 · 采购 · 售后 · 财务</div></div><div class="actions"><span id="profile" class="muted"></span><select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select><button id="refreshBtn" class="btn">刷新</button><button id="logoutBtn" class="btn">退出</button></div></div><div class="content"><div id="notice"></div><div id="content"></div></div><div class="foot">Rfriend Business OS · OPPO Austria · 正式业务数据由 Supabase 服务端权限控制</div></main></div>
